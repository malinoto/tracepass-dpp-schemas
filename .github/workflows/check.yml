# Runs the full `npm run check` on every push and pull request, not only on a
# release tag. publish.yml runs the same gate before it publishes, but by then a
# defect has already been committed and often mirrored downstream; this makes it
# fail on the commit that introduces it.
#
# `npm run check` = schema validation, index freshness, standards references,
# locale completeness (scripts/check-locales.mjs) and the citation audit
# (audit/audit.mjs; what each check means is in audit/README.md).

name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validator
        run: pip install jsonschema

      - name: Check templates
        run: npm run check
